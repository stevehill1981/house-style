extends: substitution
message: "British English: use '%s' instead of '%s'."
link: https://github.com/stevehill1981/house-style
level: suggestion
# Case-SENSITIVE on purpose: American spellings in running prose are lowercase
# ("color choice"), while capitalised forms are almost always proper nouns or
# titles we must NOT change (TRS-80 Color Computer, X-COM: UFO Defense, Chris
# Gray). Matching lowercase only kills that false-positive class wholesale.
ignorecase: false
action:
  name: replace
# Critical Rule: British English (colour, learnt, centre). Flags the clear,
# unambiguous American spellings. Deliberately omits:
#   - "program" (the documented exception — keep, don't flag "programme")
#   - "-ize/-ise" verbs (both are valid British/Oxford spelling)
#   - "license/practice" noun/verb splits (too noisy, context-dependent)
swap:
  colorful: colourful
  colorize: colourise
  color: colour
  colors: colours
  colored: coloured
  coloring: colouring
  behavior: behaviour
  behaviors: behaviours
  favorite: favourite
  favorites: favourites
  honor: honour
  neighbor: neighbour
  flavor: flavour
  flavors: flavours
  center: centre
  centers: centres
  centered: centred
  fiber: fibre
  liter: litre
  defense: defence
  offense: offence
  gray: grey
  grayscale: greyscale
  catalog: catalogue
  dialog: dialogue
  traveled: travelled
  traveling: travelling
  canceled: cancelled
  modeling: modelling
  labeled: labelled
